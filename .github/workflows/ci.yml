name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The release workflow runs these same checks on a tag (ADR-0030).
  workflow_call:

jobs:
  # Product code changed: Unreleased needs a line, unless the pull request is labelled (ADR-0030).
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-changelog.mjs ${{ github.event.pull_request.base.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build
      - run: pnpm test:scripts

  # The security suite (README guarantees) against the real stack: Caddy, API, Keycloak, Postgres.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm dev:stack
      - run: pnpm smoke
      - run: pnpm seed
      # A second seed must change nothing.
      - run: pnpm --silent seed | tee seed.log && grep -q 'nothing to change' seed.log
      - run: pnpm test:isolation
      - if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --no-color
