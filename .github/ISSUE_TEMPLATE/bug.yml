name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. pnpm dev:stack
2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Docker version, Node version, and the commit you ran.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability (those go to Security Advisories, see SECURITY.md).
          required: true
